name: Release source archive

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_CHAT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - run: npm run build
      - name: Package exact tagged source
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git archive --format=zip --prefix=daybreak-${GITHUB_REF_NAME}/ HEAD > "daybreak-${GITHUB_REF_NAME}-source.zip"
          sha256sum "daybreak-${GITHUB_REF_NAME}-source.zip" > "daybreak-${GITHUB_REF_NAME}-source.zip.sha256"
      - name: Publish release after successful checks
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "daybreak-${GITHUB_REF_NAME}-source.zip" \
            "daybreak-${GITHUB_REF_NAME}-source.zip.sha256" \
            --title "Daybreak ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
